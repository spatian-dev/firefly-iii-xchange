        <style>
            html[data-theme=dark]>body>header>.container>nav>.icons>li>a#theme-switch>svg[data-theme=light] {
                display: none;
            }

                display: none;
            }

            body>header {
                border-bottom: var(--pico-border-width) solid var(--pico-muted-border-color);
                box-shadow: var(--pico-card-box-shadow);

                .container {
                    display: flex;
                    flex-direction: row;
                    flex-wrap: wrap;
                    align-items: end;
                    justify-content: space-between;

                    a {
                        display: flex;
                        flex-direction: row;
                        flex-wrap: nowrap;
                        align-items: center;
                        text-decoration: none;
                        padding-right: var(--pico-nav-element-spacing-horizontal);

                        .logo {
                            width: 64px;
                            flex-shrink: 0;
                            margin-right: var(--pico-spacing);

                            img {
                                width: 100%;
                            }
                        }

                        hgroup {
                            margin-bottom: 0;
                        }
                    }

                    nav {
                        margin-top: var(--pico-nav-element-spacing-vertical);
                        padding-left: var(--pico-nav-element-spacing-horizontal);
                        margin-left: auto;

                        .icons {
                            li {
                                padding: 0 var(--pico-nav-element-spacing-horizontal);

                                a {
                                    padding: 0;
                                    margin: 0;
                                }
                            }
                        }
                    }
                }
            }

            body>main {
                margin: calc(var(--pico-spacing) * 1.5) 0;
            }

            body>footer {
                padding: calc(var(--pico-spacing) * 1.5) 0;
                text-align: center;
                color: var(--pico-muted-color);

                a {
                    text-decoration: none;
                }
            }
        </style>

        <script>
            const switchNode = document.getElementById('theme-switch');
            function toggleTheme(evt) {
                const theme = document.documentElement.dataset.theme == 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = theme;
                if (localStorage)
                    localStorage.setItem('color-theme', theme);
            }

            if (localStorage) {
                if (
                    (localStorage.getItem('color-theme') === 'light') ||
                    (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)
                ) {
                    toggleTheme();
                }
            }

            switchNode.onclick = toggleTheme;
            hljs.highlightAll();
        </script>
